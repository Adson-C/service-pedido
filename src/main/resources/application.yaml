spring:
  application:
    name: pedidos
  # Nucleo transacional: PostgreSQL (schema versionado pelo Flyway).
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pedidos}
    username: ${SPRING_DATASOURCE_USERNAME:pedidos}
    password: ${SPRING_DATASOURCE_PASSWORD:pedidos}

  jpa:
    open-in-view: false
    hibernate:
      # O schema e criado exclusivamente pelas migracoes do Flyway;
      # o Hibernate apenas confere se o mapeamento bate com o banco.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Historico/extrato de pontos: MongoDB.
  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://pedidos:pedidos@localhost:27017/pedidos?authSource=admin}
  data:
    mongodb:
      auto-index-creation: true

  # Mensageria: RabbitMQ.
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:pedidos}
    password: ${SPRING_RABBITMQ_PASSWORD:pedidos}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.penambucanas.pedidos: INFO